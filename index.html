<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pebble Post</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f2c84b' stroke='%23373f42' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div id="ui">
    <header id="title" class="screen">
      <p class="eyebrow hand" id="eyebrow">a fan game</p>
      <h1 class="logo block" id="logo">PEBBLE<br />POST</h1>
      <p class="tag hand" id="tag"></p>
      <button type="button" id="begin" class="begin block">BEGIN</button>
      <p class="hint hand" id="hint"></p>
      <div class="title-row">
        <button type="button" id="lang" class="text-btn block">中文</button>
        <button type="button" id="about-open" class="text-btn block">ABOUT</button>
      </div>
    </header>

    <section id="about" class="card pop hidden" hidden>
      <p class="hand" id="about-body"></p>
      <button type="button" id="about-close" class="text-btn block">Close</button>
    </section>

    <div id="place" class="block" aria-hidden="true"></div>

    <button type="button" id="btn-list" class="icon-btn" hidden aria-label="Checklist">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 14h24M12 24h24M12 34h16" /></svg>
    </button>

    <aside id="list" class="card pop hidden" hidden>
      <h2 class="block" id="list-title">CHECKLIST</h2>
      <ul id="tasks"></ul>
    </aside>

    <div id="stack" hidden>
      <button type="button" id="btn-sound" class="icon-btn" aria-label="Sound" aria-pressed="true">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 20h6l8-7v22l-8-7h-6zM32 19c2 2 2 8 0 10" /></svg>
      </button>
      <button type="button" id="btn-wear" class="icon-btn" aria-label="Clothes">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 16l8-4 8 4-3 6v14H19V22z" /></svg>
      </button>
      <button type="button" id="btn-emote" class="icon-btn" aria-label="Emotes">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="12" /><path d="M18 22h.1M30 22h.1M18 28c2 3 10 3 12 0" /></svg>
      </button>
      <button type="button" id="btn-lang" class="icon-btn block" aria-label="Language">文</button>
    </div>

    <section id="wardrobe" class="card pop hidden" hidden>
      <h2 class="block" id="wear-title">Clothes</h2>
      <div id="wear-rows"></div>
      <button type="button" id="wear-close" class="text-btn block">Close</button>
    </section>

    <section id="emotes" class="card pop hidden" hidden>
      <div id="emote-grid"></div>
    </section>

    <section id="slip" class="card pop hidden" hidden>
      <div class="tab block" id="slip-tab">NEXT UP</div>
      <p class="hand" id="slip-text"></p>
      <div class="slip-nav">
        <button type="button" id="slip-prev" class="text-btn block" aria-label="Previous">‹</button>
        <button type="button" id="slip-next" class="text-btn block" aria-label="Next">›</button>
      </div>
    </section>

    <section id="dialogue" class="card pop hidden" hidden role="dialog" aria-live="polite">
      <div class="tab block" id="dlg-tab">COURIER</div>
      <p class="hand" id="dlg-text"></p>
      <button type="button" id="dlg-next" class="next-arrow" aria-label="Next">▸</button>
    </section>

    <section id="ending" class="screen hidden" hidden>
      <h2 class="logo block" id="end-title">YOU MADE THE ROUND</h2>
      <p class="hand" id="end-body"></p>
      <p class="hand" id="end-time"></p>
      <div class="title-row">
        <button type="button" id="end-stay" class="begin block">STAY</button>
        <button type="button" id="end-again" class="text-btn block">BEGIN AGAIN</button>
      </div>
      <p class="credit hand" id="end-credit"></p>
    </section>

    <div id="joy" hidden><div id="joy-knob"></div></div>
    <p id="live" class="sr" aria-live="polite"></p>
    <p id="boot" class="hand" hidden></p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
